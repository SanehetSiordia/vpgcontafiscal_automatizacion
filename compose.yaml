name: vpg-contadores

services:
  vault-service:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      target: vault-server
      args:
        VAULT_VERSION: ${VAULT_VERSION}
    image: vpg/vault-server:${VAULT_VERSION}
    container_name: ${VAULT_CONTAINER_NAME}
    hostname: vault-service
    restart: unless-stopped
    environment:
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL}
    ports:
      # Solo loopback del host: sin el bind explicito, Docker publica en 0.0.0.0.
      - "${VAULT_HOST_BIND}:${VAULT_PORT_LOCAL}:${VAULT_PORT_REMOTE}"
    volumes:
      - vault-data:/vault/data
    networks:
      - ${DOCKER_NETWORK_NAME}
    security_opt:
      - no-new-privileges:true

  postgres-service:
    # Sin env_file a proposito: asi las variables VAULT_* (incluida
    # VAULT_ADMIN_USER_PASS) no entran en el entorno del contenedor de la base
    # de datos. Solo se declara lo que PostgreSQL necesita.
    build:
      context: .
      dockerfile: Dockerfile
      target: postgres-server
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION}
    image: vpg/postgres-server:${POSTGRES_VERSION}
    container_name: ${POSTGRES_CONTAINER_NAME}
    hostname: postgres-service
    restart: unless-stopped
    environment:
      # Parametros NO sensibles (vienen de .env).
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      # Contrasenas: SOLO por archivo de secreto, nunca como valor en .env.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_password
      - postgres_app_password
    ports:
      # Publicado solo en la interfaz de loopback del host.
      - "${POSTGRES_HOST_BIND}:${POSTGRES_PORT_LOCAL}:${POSTGRES_PORT_REMOTE}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK_NAME}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # pg_isready contra el socket local, con el usuario y la base reales.
      test: ["CMD-SHELL", "pg_isready --quiet --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      - vault-service

  user-mgmt-service:
    # Sin env_file: la API no carga el .env del proyecto. Recibe solo sus
    # parametros USER_MGMT_* y lee las credenciales de archivos de secreto.
    build:
      context: .
      dockerfile: Dockerfile
      target: user-mgmt-server
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: vpg/user-mgmt-server:${USER_MGMT_VERSION}
    container_name: ${USER_MGMT_CONTAINER_NAME}
    hostname: user-mgmt-service
    restart: unless-stopped
    environment:
      USER_MGMT_ENVIRONMENT: ${USER_MGMT_ENVIRONMENT}
      USER_MGMT_LOG_LEVEL: ${USER_MGMT_LOG_LEVEL}
      USER_MGMT_API_PREFIX: ${USER_MGMT_API_PREFIX}
      # Dentro de la red se usan los nombres de servicio y los puertos del
      # contenedor; los puertos publicados en el host no intervienen.
      USER_MGMT_POSTGRES_HOST: postgres-service
      USER_MGMT_POSTGRES_PORT: ${POSTGRES_PORT_REMOTE}
      USER_MGMT_POSTGRES_DB: ${POSTGRES_DB}
      USER_MGMT_POSTGRES_USER: ${POSTGRES_APP_USER}
      USER_MGMT_POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
      USER_MGMT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      USER_MGMT_VAULT_ADDR: http://vault-service:${VAULT_PORT_REMOTE}
      USER_MGMT_VAULT_USERPASS_PATH: ${VAULT_USERPASS_PATH}
      USER_MGMT_VAULT_MFA_METHOD_NAME: ${VAULT_MFA_METHOD_NAME}
      USER_MGMT_VAULT_MFA_ENFORCEMENT: ${VAULT_MFA_ENFORCEMENT}
      USER_MGMT_VAULT_ROLE_ID_FILE: /run/secrets/vault_role_id
      USER_MGMT_VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
      USER_MGMT_SESSION_TTL_SECONDS: ${USER_MGMT_SESSION_TTL_SECONDS}
      USER_MGMT_CHALLENGE_TTL_SECONDS: ${USER_MGMT_CHALLENGE_TTL_SECONDS}
      USER_MGMT_SENSITIVE_OP_MFA_MAX_AGE_SECONDS: ${USER_MGMT_SENSITIVE_OP_MFA_MAX_AGE_SECONDS}
      USER_MGMT_RATE_LIMIT_LOGIN_PER_MINUTE: ${USER_MGMT_RATE_LIMIT_LOGIN_PER_MINUTE}
      USER_MGMT_RATE_LIMIT_MFA_PER_MINUTE: ${USER_MGMT_RATE_LIMIT_MFA_PER_MINUTE}
      USER_MGMT_RATE_LIMIT_SESSION_PER_MINUTE: ${USER_MGMT_RATE_LIMIT_SESSION_PER_MINUTE}
      # --- Etapa 4: pasarela interna para vault-mgmt-service ----------------
      USER_MGMT_INTERNAL_CREDENTIAL_FILE: /run/secrets/vault_mgmt_internal_token
      USER_MGMT_MFA_PROOF_TTL_SECONDS: ${VAULT_MGMT_MFA_PROOF_TTL_SECONDS}
      USER_MGMT_CATALOG_SCHEMA: ${VAULT_MGMT_POSTGRES_SCHEMA}
      USER_MGMT_WRAP_TTL_SECONDS: ${VAULT_MGMT_WRAP_TTL_SECONDS}
      USER_MGMT_MAX_VERSIONS_PER_REQUEST: ${VAULT_MGMT_MAX_VERSIONS_PER_REQUEST}
      USER_MGMT_MAX_COLLECTION_BATCH: ${VAULT_MGMT_MAX_COLLECTION_BATCH}
    secrets:
      # Solo estos archivos, no el directorio secrets/ completo.
      - postgres_app_password
      - vault_role_id
      - vault_secret_id
      # Credencial compartida con vault-mgmt-service. Las DOS puntas la leen de
      # archivo; nunca viaja como variable de entorno con su valor.
      - vault_mgmt_internal_token
    ports:
      - "${USER_MGMT_HOST_BIND}:${USER_MGMT_PORT_LOCAL}:${USER_MGMT_PORT_REMOTE}"
    networks:
      - ${DOCKER_NETWORK_NAME}
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres-service:
        condition: service_healthy
      # Vault NO lleva condition: service_healthy a proposito. Arranca sellado
      # y el desbloqueo es manual: la API debe poder levantarse igualmente y
      # responder 503 en readiness hasta que se desbloquee.
      vault-service:
        condition: service_started
    healthcheck:
      # /health/live, no /health/ready: el contenedor esta sano aunque Vault
      # siga sellado. Readiness es otra cosa y se consulta aparte.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  vault-mgmt-service:
    # Sin env_file, igual que user-mgmt: este proceso no debe ver la clave de
    # unseal ni el token inicial de Vault que viven en el .env del proyecto.
    build:
      context: .
      dockerfile: Dockerfile
      target: vault-mgmt-server
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: vpg/vault-mgmt-server:${VAULT_MGMT_VERSION}
    container_name: ${VAULT_MGMT_CONTAINER_NAME}
    hostname: vault-mgmt-service
    restart: unless-stopped
    environment:
      VAULT_MGMT_ENVIRONMENT: ${VAULT_MGMT_ENVIRONMENT}
      VAULT_MGMT_LOG_LEVEL: ${VAULT_MGMT_LOG_LEVEL}
      VAULT_MGMT_API_PREFIX: ${VAULT_MGMT_API_PREFIX}
      # Dentro de la red se usan nombres de servicio y puertos de contenedor.
      VAULT_MGMT_POSTGRES_HOST: postgres-service
      VAULT_MGMT_POSTGRES_PORT: ${POSTGRES_PORT_REMOTE}
      VAULT_MGMT_POSTGRES_DB: ${POSTGRES_DB}
      VAULT_MGMT_POSTGRES_USER: ${POSTGRES_APP_USER}
      VAULT_MGMT_POSTGRES_SCHEMA: ${VAULT_MGMT_POSTGRES_SCHEMA}
      VAULT_MGMT_POSTGRES_EMPLOYEES_SCHEMA: ${POSTGRES_SCHEMA}
      VAULT_MGMT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      VAULT_MGMT_VAULT_ADDR: http://vault-service:${VAULT_PORT_REMOTE}
      VAULT_MGMT_KV_MOUNT: ${VAULT_MGMT_KV_MOUNT}
      VAULT_MGMT_KV_PREFIX: ${VAULT_MGMT_KV_PREFIX}
      VAULT_MGMT_USER_MGMT_BASE_URL: http://user-mgmt-service:${USER_MGMT_PORT_REMOTE}
      VAULT_MGMT_INTERNAL_CREDENTIAL_FILE: /run/secrets/vault_mgmt_internal_token
      VAULT_MGMT_WRAP_TTL_SECONDS: ${VAULT_MGMT_WRAP_TTL_SECONDS}
      VAULT_MGMT_MAX_COLLECTION_BATCH: ${VAULT_MGMT_MAX_COLLECTION_BATCH}
      VAULT_MGMT_MAX_VERSIONS_PER_REQUEST: ${VAULT_MGMT_MAX_VERSIONS_PER_REQUEST}
      VAULT_MGMT_MAX_CRAWLER_RECORDS: ${VAULT_MGMT_MAX_CRAWLER_RECORDS}
      VAULT_MGMT_MAX_RECORD_BYTES: ${VAULT_MGMT_MAX_RECORD_BYTES}
      VAULT_MGMT_RATE_LIMIT_SESSION_PER_MINUTE: ${VAULT_MGMT_RATE_LIMIT_SESSION_PER_MINUTE}
      VAULT_MGMT_RATE_LIMIT_CONSUMER_PER_MINUTE: ${VAULT_MGMT_RATE_LIMIT_CONSUMER_PER_MINUTE}
      VAULT_MGMT_RATE_LIMIT_GLOBAL_PER_MINUTE: ${VAULT_MGMT_RATE_LIMIT_GLOBAL_PER_MINUTE}
    secrets:
      - postgres_app_password
      - vault_mgmt_internal_token
    ports:
      # Solo loopback del host, igual que los demas.
      - "${VAULT_MGMT_HOST_BIND}:${VAULT_MGMT_PORT_LOCAL}:${VAULT_MGMT_PORT_REMOTE}"
    networks:
      - ${DOCKER_NETWORK_NAME}
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres-service:
        condition: service_healthy
      # Vault y user-mgmt van con service_started, NO service_healthy:
      #   * Vault arranca sellado y el unseal es manual.
      #   * user-mgmt puede estar vivo pero no listo por ese mismo motivo.
      # Exigir salud aqui crearia un arranque en cadena imposible de
      # diagnosticar. Readiness lo refleja con 503 y dice que falta.
      vault-service:
        condition: service_started
      user-mgmt-service:
        condition: service_started
    healthcheck:
      # /health/live, no /health/ready: el contenedor esta sano aunque Vault
      # siga sellado o la pasarela no responda todavia.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  vault-data:
    name: ${VAULT_VOLUME_NAME}
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME}

networks:
  network-service:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge

secrets:
  # Archivos generados por scripts/postgres/prepare-secrets.sh.
  # Se montan en /run/secrets/<nombre> dentro del contenedor y estan excluidos
  # del repositorio (.gitignore) y del contexto de build (.dockerignore).
  postgres_password:
    file: ./secrets/postgres_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
  # Credenciales de la cuenta tecnica (AppRole) de user-mgmt-service, creadas
  # por scripts/user_mgmt/vault-approle-bootstrap.sh. Nunca el Initial Root
  # Token ni la contrasena del administrador humano.
  vault_role_id:
    file: ./secrets/vault_role_id
  vault_secret_id:
    file: ./secrets/vault_secret_id
  # Credencial INTERNA entre vault-mgmt-service y la pasarela de
  # user-mgmt-service, creada por
  # scripts/vault_mgmt/prepare-internal-secret.sh. Es independiente del Bearer
  # humano y no lo sustituye: las dos son obligatorias.
  vault_mgmt_internal_token:
    file: ./secrets/vault_mgmt_internal_token
