# -----------------------------------------------------------------------------
# Cabeceras de seguridad del DOCUMENTO y de los estaticos.
#
# Se incluye DENTRO de cada location que las necesita, no una sola vez en el
# server. Motivo: en Nginx, un `add_header` en una location **reemplaza** las
# heredadas del server en vez de sumarse a ellas, asi que basta con que una
# location anada una cabecera propia para perder todas las del nivel de arriba.
# Repetir el include es lo que hace que la herencia no sea un accidente.
#
# `always` hace que la cabecera salga tambien en respuestas de error (4xx/5xx),
# que es justo donde mas se olvida.
# -----------------------------------------------------------------------------

# CSP del runtime estatico. Todo del mismo origen; sin objetos y sin enmarcado.
#
# Dos ausencias deliberadas:
#   * nada de 'unsafe-inline' en script-src. Por eso Vite se construye con
#     modulePreload.polyfill desactivado: con el valor por omision inyecta un
#     script inline en index.html.
#   * nada de 'unsafe-inline' en style-src, que en CSP cubre tambien los
#     atributos style="..."; por eso el codigo TSX no usa estilos en linea y
#     todo pasa por la hoja externa.
#
# El QR se dibuja como SVG en linea con la libreria local, asi que no hace
# falta `data:` en img-src ni ningun origen externo de imagenes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
