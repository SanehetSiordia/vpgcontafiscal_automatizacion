# -----------------------------------------------------------------------------
# Rutas de la aplicacion: estaticos, fallback de la SPA y pasarela de la API.
#
# Se incluye desde el servidor que sirve de verdad la aplicacion (el de HTTP en
# modo local, o el de HTTPS cuando TLS esta activo). El servidor de redireccion
# NO incluye esto: no debe servir ni el login ni la API.
# -----------------------------------------------------------------------------

# Resolutor de Docker. Hace falta porque el upstream se nombra con una variable
# (ver mas abajo): asi, si user-mgmt-service se recrea y cambia de IP, no se
# queda cacheada la de siempre.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# --- API: unico prefijo que se reenvia --------------------------------------
#
# /api/user_mgmt/v1/<resto>  ->  http://user-mgmt-service:8000/user_mgmt/v1/<resto>
#
# Se escribe con una expresion regular y una variable a proposito:
#   * la captura `ruta` hace explicita la reescritura y evita el error clasico
#     de duplicar o comerse el prefijo con las barras de proxy_pass;
#   * la variable `$destino` fuerza a Nginx a resolver el nombre en tiempo de
#     peticion con el resolutor de arriba, en vez de fijar la IP al arrancar.
#
# No se reenvia nada mas: ni /internal, ni Vault, ni PostgreSQL, ni los
# endpoints de maquina. Lo que no encaje aqui cae en la location /api/ de
# abajo, que responde 404 y NO sirve index.html.
location ~ ^/api/user_mgmt/v1/(?<ruta>.*)$ {
  set $destino user-mgmt-service;
  proxy_pass http://$destino:8000/user_mgmt/v1/$ruta$is_args$args;

  proxy_http_version 1.1;
  proxy_set_header Host $proxy_host;
  # El Bearer de la sesion se conserva tal cual: sin el, la API no autoriza.
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Request-ID $http_x_request_id;
  proxy_set_header X-VPG-MFA-Proof $http_x_vpg_mfa_proof;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $vpg_scheme;
  proxy_set_header Connection "";
  proxy_pass_request_headers on;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  # Una respuesta incierta no se repite contra otro intento: el login, el MFA y
  # la inscripcion no son idempotentes.
  proxy_next_upstream off;
  # Un error del upstream se devuelve como error, no se sustituye por una
  # pagina propia (y menos por index.html).
  proxy_intercept_errors off;

  # Nada de la API se guarda en cache, en ningun navegador ni intermediario.
  # Se OCULTA primero la del upstream para no acabar con dos cabeceras: la API
  # ya manda `no-store` en login, MFA, inscripcion y reset.
  proxy_hide_header Cache-Control;
  proxy_hide_header Pragma;
  proxy_hide_header Expires;
  add_header Cache-Control "no-store" always;
  add_header Pragma "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# Cualquier otra ruta bajo /api/ es un error de API, no una ruta de interfaz.
location /api/ {
  include /etc/nginx/vpg/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  default_type application/json;
  return 404 '{"code":"no_proxy","message":"el frontend solo reenvia /api/user_mgmt/v1/"}';
}

# --- salud del propio frontend ----------------------------------------------
#
# Comprueba que este servidor responde y que su configuracion esta cargada. NO
# consulta al backend: fingir la salud de user-mgmt aqui solo serviria para que
# un backend caido pareciera sano.
location = /healthz {
  access_log off;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  default_type application/json;
  return 200 '{"status":"ok","service":"frontend-service"}';
}

# --- estaticos con nombre inmutable -----------------------------------------
#
# Vite pone un hash del contenido en el nombre, asi que un archivo con ese
# nombre no cambia nunca: cache larga sin riesgo de servir algo viejo.
location /assets/ {
  include /etc/nginx/vpg/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# --- el documento y el resto de la interfaz ---------------------------------
#
# `index.html` se revalida siempre: es lo que apunta a los assets con hash, y
# si se cacheara, un despliegue nuevo seguiria sirviendo el anterior.
location = /index.html {
  include /etc/nginx/vpg/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;
}

# Fallback de la SPA: /login, /mfa, /inicio, /configuracion-totp y las rutas
# profundas devuelven el documento, y es React Router quien decide la pantalla.
location / {
  include /etc/nginx/vpg/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri /index.html;
}
