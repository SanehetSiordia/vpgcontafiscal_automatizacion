# =============================================================================
# Configuracion principal de Nginx para frontend-service (etapa 5.1).
#
# No se usa la de la imagen oficial ni su directorio conf.d: este archivo
# sustituye al principal para poder correr como usuario NO root (pid y
# temporales en /tmp) y para controlar que se registra.
#
# El bloque de servidor se genera en el arranque segun el modo (HTTP o HTTPS) y
# se incluye desde /etc/nginx/vpg/server.conf. Ver vpg-frontend-entrypoint.sh.
# =============================================================================

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Todo lo escribible va a /tmp: la imagen corre con un usuario sin
  # privilegios y sin permiso de escritura en /var/cache/nginx.
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  # Se registra la ruta NORMALIZADA ($uri) y no $request: asi no entran en el
  # log ni la cadena de consulta ni la version del protocolo. Las cabeceras
  # (Authorization incluida) no se registran nunca, y tampoco los cuerpos.
  log_format vpg '$remote_addr "$request_method $uri" $status '
                 '$body_bytes_sent ${request_time}s';
  access_log /dev/stdout vpg;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 256k;

  # Sin proxy_cache_path: no hay cache de proxy, asi que ninguna respuesta de
  # autenticacion o de inscripcion puede quedarse guardada en el proxy.

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied off;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml;

  include /etc/nginx/vpg/server.conf;
}
